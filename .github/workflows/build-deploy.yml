name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ["更新博客索引"]
    types:
      - completed
    branches: [main]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python 环境 # 根据 SSG 来确定环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 下载依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create assets directory if needed
        run: mkdir -p assets

      - name: Build static site
        run: python .github/scripts/static_gen.py

      - name: 设置 SSH 密钥
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: 克隆目标仓库
        run: |
          git clone git@github.com:wardenxyz/wardenxyz.github.io.git target_repo

      - name: 复制生成的文件到目标仓库
        run: |
          rsync -av --delete site/* target_repo/

      - name: 提交并推送更改到目标仓库
        run: |
          cd target_repo
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add .
          git commit -m "Deploy - $(date -u '+%Y-%m-%d %H:%M:%S' -d '8 hour')"
          git push origin main
