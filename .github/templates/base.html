<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>{{ title }}</title>
  {{ seo_head }}
  
  <!-- Performance optimizations -->
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- Critical CSS -->
  <link rel="stylesheet" href="{{ base }}static/style.css" />
  <link rel="stylesheet" href="{{ base }}static/theme.css" />
  <!-- Prism.js 代码高亮 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css" />
  <link rel="icon" href="{{ base }}static/favicon.svg" type="image/svg+xml" />
  <link rel="alternate" type="application/rss+xml" title="My Blog" href="{{ base }}feed.xml" />
  
  <!-- Apply saved theme early to avoid FOUC -->
  <script>
    (function(){
      try{
        var t = localStorage.getItem('theme');
        if(t === 'light' || t === 'dark'){
          document.documentElement.setAttribute('data-theme', t);
        }
      }catch(_e){/* noop */}
    })();
    
    // Register Service Worker for better caching
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        var basePath = (document.body && document.body.getAttribute('data-base')) || '';
        var scope = basePath || './';
        if (scope.charAt(scope.length - 1) !== '/') {
          scope += '/';
        }
        var swUrl = (basePath || '') + 'static/sw.js';
        navigator.serviceWorker.register(swUrl, { scope: scope })
          .then(function(registration) {
            console.log('SW registered with scope: ', registration.scope);
          })
          .catch(function(error) {
            console.log('SW registration failed: ', error);
          });
      });
    }
  </script>
  
  <!-- MathJax: only load when page actually contains math -->
  <script>
    (function(){
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']],
          processEscapes: true,
          processEnvironments: true,
          tags: 'ams'
        },
        options: {
          ignoreHtmlClass: 'tex2jax_ignore',
          processHtmlClass: 'tex2jax_process'
        },
        svg: {
          fontCache: 'global'
        }
      };

      function pageHasMath(){
        try{
          var content = document.getElementById('content');
          if(!content) return false;
          var text = content.textContent || '';
          return /\$[^$]+\$|\\\(|\\\[|\\begin\{equation\}/.test(text);
        }catch(_e){
          return false;
        }
      }

      function loadMathJax(){
        if(document.getElementById('MathJax-script')) return;
        var s = document.createElement('script');
        s.id = 'MathJax-script';
        s.async = true;
        s.src = 'https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js';
        document.head.appendChild(s);
      }

      if(document.readyState === 'loading'){
        document.addEventListener('DOMContentLoaded', function(){
          if(pageHasMath()) loadMathJax();
        });
      }else{
        if(pageHasMath()) loadMathJax();
      }
    })();
  </script>
  
  <!-- Mermaid Diagram -->
  <script>
    // Optimize Mermaid loading
    function loadMermaid() {
      if (document.querySelector('.mermaid')) {
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
        script.defer = true;
        script.onload = function() {
          if(window.mermaid && mermaid.initialize){
            const dt = document.documentElement.getAttribute('data-theme');
            const theme = dt === 'dark' ? 'dark' : (dt === 'light' ? 'default' : ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'default'));
            mermaid.initialize({ startOnLoad: true, theme });
            if(mermaid.run){
              try{ mermaid.run({ querySelector: '.mermaid' }); }catch(e){}
            }
          }
        };
        document.head.appendChild(script);
      }
    }
    
    // Load Mermaid only when needed
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadMermaid);
    } else {
      loadMermaid();
    }
  </script>
</head>
<body data-base="{{ base }}">
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ base }}index.html">My Blog</a>
      
      <!-- 导航链接 -->
      <nav class="nav" id="primaryNav">
        <a class="nav-link" href="{{ base }}index.html">首页</a>
        <a class="nav-link" href="{{ base }}categories.html">分类</a>
        <a class="nav-link" href="{{ base }}tags.html">标签</a>
        <a class="nav-link github" href="https://github.com/wardenxyz" target="_blank" rel="noopener">GitHub</a>
      </nav>
      
      <!-- 内嵌搜索框（电脑端） -->
      <div class="header-search" id="headerSearch">
        <span class="header-search-icon">🔍</span>
        <input type="search" id="headerSearchInput" class="header-search-input" placeholder="搜索文章..." aria-label="搜索文章" autocomplete="off" />
        <div class="header-search-results" id="headerSearchResults"></div>
      </div>
      
      <!-- 移动端搜索按钮 -->
      <button class="icon-button search-toggle" id="searchToggle" aria-label="打开搜索" title="搜索">🔍</button>
      
      <!-- 主题切换 -->
      <button class="theme-toggle" id="themeToggle" aria-label="切换主题" title="切换主题">🖥️</button>
      
      <!-- 移动端按钮 -->
      <button class="menu-toggle" id="menuToggle" aria-label="打开菜单" aria-controls="primaryNav" aria-expanded="false">☰</button>
      <button class="drawer-toggle sidebar-toggle" id="sidebarToggle" aria-label="打开文章目录" aria-controls="sidebar" aria-expanded="false">目录</button>
      <button class="drawer-toggle toc-toggle" id="tocToggle" aria-label="打开大纲" aria-controls="toc" aria-expanded="false">大纲</button>
    </div>
    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </header>

  <main class="container layout layout-3">
    <!-- 手机端抽屉遮罩层 -->
    <div class="drawer-overlay" id="drawerOverlay"></div>
    <aside class="sidebar-col" id="sidebar">
      {{ sidebar }}
    </aside>
    <article class="content" id="content">
  {{ breadcrumbs }}
  {{ meta }}
  {{ content }}
    </article>
    <aside class="toc" id="toc">
      <div class="toc-title">大纲</div>
      {{ toc }}
    </aside>
  </main>

  <footer class="site-footer">
    <div class="container" style="text-align: center;">
      <div>© 2024 - {{ year }} wardenxyz</div>
      <div>MIT License</div>
    </div>
  </footer>

  <button id="backToTop" class="back-to-top" aria-label="回到顶部" title="回到顶部">↑</button>

  <div class="search-modal" id="searchModal" role="dialog" aria-modal="true" aria-labelledby="searchModalLabel">
    <div class="search-modal__panel">
      <div class="search-modal__header">
        <div class="search-modal__title" id="searchModalLabel">搜索</div>
        <button class="icon-button search-close" id="searchClose" aria-label="关闭搜索">✕</button>
      </div>
      <div class="search-modal__body">
        <label class="search-input-wrapper" for="searchInput">
          <span class="search-input-icon">🔍</span>
          <input type="search" id="searchInput" placeholder="搜索文章..." aria-label="搜索文章" autocomplete="off" />
        </label>
        <div class="search-results" id="searchResults" role="listbox" aria-label="搜索结果" aria-live="polite" aria-expanded="false"></div>
      </div>
    </div>
  </div>

  <!-- Main JavaScript with defer for better performance -->
  <script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.min.js" defer></script>
  <script src="{{ base }}static/main.js" defer></script>
  
  <!-- Prism.js 代码语法高亮 -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/autoloader/prism-autoloader.min.js" defer></script>
  
  <!-- Medium Zoom for Image Lightbox -->
  <script src="https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/dist/medium-zoom.min.js" defer></script>
  
  <!-- 代码块语言标签 -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      document.querySelectorAll('pre[class*="language-"]').forEach(function(pre) {
        var match = pre.className.match(/language-(\w+)/);
        if (match && match[1]) {
          var lang = match[1];
          // 美化语言名称
          var langMap = {
            'js': 'JavaScript', 'javascript': 'JavaScript',
            'ts': 'TypeScript', 'typescript': 'TypeScript',
            'py': 'Python', 'python': 'Python',
            'rb': 'Ruby', 'ruby': 'Ruby',
            'sh': 'Shell', 'bash': 'Bash', 'shell': 'Shell', 'zsh': 'Zsh',
            'ps1': 'PowerShell', 'powershell': 'PowerShell',
            'html': 'HTML', 'css': 'CSS', 'scss': 'SCSS', 'sass': 'Sass',
            'json': 'JSON', 'yaml': 'YAML', 'yml': 'YAML', 'toml': 'TOML',
            'xml': 'XML', 'md': 'Markdown', 'markdown': 'Markdown',
            'sql': 'SQL', 'graphql': 'GraphQL',
            'c': 'C', 'cpp': 'C++', 'csharp': 'C#', 'cs': 'C#',
            'java': 'Java', 'kotlin': 'Kotlin', 'swift': 'Swift',
            'go': 'Go', 'rust': 'Rust', 'rs': 'Rust',
            'php': 'PHP', 'lua': 'Lua', 'r': 'R',
            'dockerfile': 'Dockerfile', 'docker': 'Docker',
            'nginx': 'Nginx', 'apache': 'Apache',
            'vim': 'Vim', 'typst': 'Typst', 'latex': 'LaTeX', 'tex': 'TeX'
          };
          var displayName = langMap[lang.toLowerCase()] || lang.toUpperCase();
          pre.setAttribute('data-language', displayName);
        }
      });
    });
  </script>
  
  <!-- Only load performance tooling in dev / when explicitly requested -->
  <script>
    (function(){
      try{
        var isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        var params = new URLSearchParams(location.search || '');
        if(isLocal || params.get('debug-perf') === '1'){
          var s = document.createElement('script');
          s.src = '{{ base }}static/performance.js';
          s.defer = true;
          document.head.appendChild(s);
        }
      }catch(_e){/* noop */}
    })();
  </script>
</body>
</html>
