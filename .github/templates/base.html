<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title }}</title>
  <link rel="stylesheet" href="{{ base }}static/style.css" />
  <link rel="icon" href="{{ base }}static/favicon.svg" type="image/svg+xml" />
  <meta name="color-scheme" content="light dark" />
  <!-- Apply saved theme early to avoid FOUC -->
  <script>
    (function(){
      try{
        var t = localStorage.getItem('theme');
        if(t === 'light' || t === 'dark'){
          document.documentElement.setAttribute('data-theme', t);
        }
      }catch(_e){/* noop */}
    })();
  </script>
  
  <!-- MathJax Configuration -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
        processEnvironments: true,
        tags: 'ams'
      },
      options: {
        ignoreHtmlClass: 'tex2jax_ignore',
        processHtmlClass: 'tex2jax_process'
      },
      svg: {
        fontCache: 'global'
      }
    };
  </script>
  <script type="text/javascript" id="MathJax-script" async
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js">
  </script>
  <!-- Mermaid Diagram -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js" defer></script>
  <script>
    // Initialize Mermaid when DOM is ready
    document.addEventListener('DOMContentLoaded', function(){
      if(window.mermaid && mermaid.initialize){
        // Respect explicit data-theme over system preference
        const dt = document.documentElement.getAttribute('data-theme');
        const theme = dt === 'dark' ? 'dark' : (dt === 'light' ? 'default' : ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'default'));
        mermaid.initialize({ startOnLoad: true, theme });
        if(mermaid.run){
          try{ mermaid.run({ querySelector: '.mermaid' }); }catch(e){}
        }
      }
    });
  </script>
</head>
<body data-base="{{ base }}">
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ base }}index.html">My Blog</a>
  <button class="menu-toggle" id="menuToggle" aria-label="打开菜单" aria-controls="primaryNav" aria-expanded="false">☰</button>
      <div class="search" role="search">
        <input type="search" id="searchInput" placeholder="搜索文章..." aria-label="搜索文章" autocomplete="off" />
        <div class="search-results" id="searchResults" role="listbox" aria-label="搜索结果"></div>
      </div>
      <button class="theme-toggle" id="themeToggle" aria-label="切换主题" title="切换主题">🖥️</button>
      <nav class="nav" id="primaryNav">
        <a class="nav-link" href="{{ base }}index.html">首页</a>
        <a class="nav-link" href="{{ base }}categories.html">Categories</a>
        <a class="nav-link" href="{{ base }}tags.html">Tags</a>
        <a class="nav-link github" href="https://github.com/wardenxyz" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </div>
  </header>

  <main class="container layout layout-3">
    <aside class="sidebar-col" id="sidebar">
      {{ sidebar }}
    </aside>
    <article class="content" id="content">
  {{ meta }}
  {{ content }}
    </article>
    <aside class="toc" id="toc">
      <div class="toc-title">大纲</div>
      {{ toc }}
    </aside>
  </main>

  <footer class="site-footer">
    <div class="container" style="text-align: center;">
      <div>© 2024 - {{ year }} wardenxyz</div>
      <div>MIT License</div>
    </div>
  </footer>

  <button id="backToTop" class="back-to-top" aria-label="回到顶部">↑</button>

  <script src="{{ base }}static/main.js"></script>
</body>
</html>
